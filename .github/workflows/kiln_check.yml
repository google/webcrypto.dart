name: Kiln check

on:
  pull_request:
    branches: [main]
    paths:
      - native_artifacts/prebuilt.json
      - native_artifacts/source_excludes.txt
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@14aa316a575c5c7fd543a924b5c1973c24301ab2 # v0.5.16
